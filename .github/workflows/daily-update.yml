name: daily-update
on:
  schedule:
    - cron: "17 6 * * *"    # after US games finish (06:17 UTC)
    - cron: "17 14 * * *"   # afternoon refresh: injury news
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: daily-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download previous database (if any)
        run: |
          gh release download data -p nba.sqlite.gz -D . || echo "no previous snapshot"
          if [ -f nba.sqlite.gz ]; then gunzip -f nba.sqlite.gz; fi
      - name: Update games and injuries
        run: python -m nba_data_pipeline.cli daily-update --db nba.sqlite --days 3 --bootstrap-from 2026-10-01
      - name: Publish snapshot
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect("nba.sqlite"); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.execute("VACUUM"); c.close()
          PY
          gzip -9 -f -k nba.sqlite
          gh release view data >/dev/null 2>&1 || gh release create data --title "Data snapshot" --notes "Updated automatically. Do not edit."
          gh release upload data nba.sqlite.gz --clobber

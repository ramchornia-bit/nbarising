services:
  - type: web
    name: court-signal
    runtime: docker
    plan: starter            # persistent disk needs a paid plan (about 7 USD/month)
    healthCheckPath: /api/v1/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COURT_SIGNAL_API_KEY
        generateValue: true
      - key: BOOTSTRAP_FROM
        value: "2026-10-01"
      - key: UPDATE_HOURS
        value: "6"

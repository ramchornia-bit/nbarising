services:
  - type: web
    name: court-signal
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: COURT_SIGNAL_API_KEY
        generateValue: true
      - key: SNAPSHOT_REPO          # your-github-name/your-repo-name  (set in the Render dashboard)
        sync: false
      - key: SNAPSHOT_TOKEN         # GitHub token, read access to the repo (set in the Render dashboard)
        sync: false
